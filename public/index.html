<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍿 سهرة بلس | متصفح السينما الافتراضي المباشر (Hyperbeam Engine)</title>
  <!-- خطوط Cairo و GE SS Two الفاخرة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شريط الملاحة العلوي -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-logo">🍿 سهرة بلس</div>
      <div class="brand-badge">HYPERBEAM ENGINE</div>
      <div class="connection-status" title="حالة الاتصال بالسيرفر">
        <span class="status-dot"></span>
        <span class="status-text">مباشر</span>
      </div>
    </div>

    <!-- أزرار التبديل بين وضع المتصفح الافتراضي ومشغل الفيديو -->
    <div class="mode-switcher">
      <button class="mode-btn active" id="btnModeBrowser" onclick="switchMainMode('browser')">
        🌐 المتصفح المفتوح (تصفح أي موقع)
      </button>
      <button class="mode-btn" id="btnModePlayer" onclick="switchMainMode('player')">
        🎬 مشغل الفيديو المباشر
      </button>
    </div>

    <!-- معلومات القاعة والتحكم -->
    <div class="header-actions">
      <div class="room-badge" id="roomCodeBadge" onclick="copyInviteLink()" title="انقر لنسخ رابط السهرة">
        <span>🍿</span>
        <span>قاعة: ...</span>
      </div>

      <button class="control-toggle" id="hostControlBtn" onclick="toggleHostLock()">
        🔓 التحكم: للجميع
      </button>

      <!-- زر مكتبة الأفلام المفضلة -->
      <button class="library-btn" id="libraryBtn" onclick="toggleFavoritesModal()" title="مكتبة أفلامي المفضلة">
        ⭐ مكتبتي (<span id="favCountBadge">0</span>)
      </button>

      <button class="mobile-chat-toggle" id="mobileChatToggle" onclick="toggleMobileChat()" title="فتح / إغلاق الدردشة">
        💬 الدردشة
      </button>
    </div>
  </header>

  <!-- التخطيط الرئيسي -->
  <main class="cinema-layout" id="cinemaMainLayout">

    <section class="main-stage">

      <!-- 1. واجهة المتصفح الافتراضي الحقيقي (Hyperbeam Canvas Engine) -->
      <div class="browser-view" id="browserView">
        <!-- شريط أدوات التصفح -->
        <div class="browser-nav-bar">
          <button class="nav-ctrl-btn" onclick="browserGoBack()" title="للخلف">◀</button>
          <button class="nav-ctrl-btn" onclick="browserGoForward()" title="للأمام">▶</button>
          <button class="nav-ctrl-btn" onclick="browserReload()" title="تحديث">🔄</button>
          <button class="nav-ctrl-btn" onclick="browserNavigateTo('https://www.google.com')" title="الصفحة الرئيسية (Google)">🏠</button>

          <input type="text" id="browserUrlInput" class="browser-url-input" placeholder="ابحث في Google أو اكتب أي رابط (مثال: egydead أو youtube)..." value="https://www.google.com" onkeypress="if(event.key==='Enter') applyBrowserUrl()">

          <button class="btn-primary" onclick="applyBrowserUrl()">تصفح 🚀</button>

          <!-- زر التحكم في جودة البث لمنع البكسلة والتهنيج -->
          <div class="quality-selector-box" title="التحكم في جودة البث وسرعته">
            <label for="browserQualitySelect" class="quality-label">الجودة:</label>
            <select id="browserQualitySelect" class="quality-select" onchange="changeBrowserQuality(this.value)">
              <option value="ultra">💎 فائقة (1080p - نقاء سينمائي)</option>
              <option value="high" selected>✨ عالية (720p - متوازنة)</option>
              <option value="medium">⚡ متوسطة (سلسة)</option>
              <option value="fast">🚀 خفيفة (انترنت ضعيف / بدون تهنيج)</option>
            </select>
          </div>

          <!-- التحكم في إضاءة السينما المحيطية بخطوط رأسية (Vertical Ambient Light) -->
          <div class="ambient-control-box" title="التحكم في شدة إضاءة الخطوط الرأسية الخلفية">
            <button class="ambient-toggle-btn" id="ambientToggleBtn" onclick="toggleAmbientLight()" title="تشغيل / إيقاف الإضاءة الخلفية">💡</button>
            <label for="ambientBrightnessSlider" class="ambient-ctrl-label">الإضاءة:</label>
            <input type="range" id="ambientBrightnessSlider" class="ambient-slider" min="0" max="100" value="70" oninput="setAmbientBrightness(this.value)">
            <span id="ambientBrightnessValue" class="ambient-val-badge">70%</span>
          </div>

          <button class="nav-ctrl-btn" onclick="startScreenShare()" title="مشاركة الشاشة الحية مع الصوت">🖥️</button>
          <button class="nav-ctrl-btn fav-nav-btn" onclick="addCurrentToFavorites()" title="حفظ الفيلم الحالي في المفضلة">❤️</button>
        </div>

        <!-- شريط الوصول السريع للمواقع المحفوظة (Quick Access Bookmarks) -->
        <div class="quick-access-bar" id="quickAccessBar">
          <div class="quick-access-label">
            <span class="quick-icon">📌</span>
            <span>وصول سريع:</span>
          </div>
          <div class="quick-access-list" id="quickAccessList">
            <!-- يتم تعبئة المواقع المحفوظة تلقائياً من الذاكرة -->
          </div>
          <button class="quick-add-btn" onclick="addCurrentToQuickAccess()" title="حفظ الموقع الحالي في شريط الوصول السريع">
            <span>➕</span> حفظ الموقع الحالي
          </button>
        </div>

        <!-- مساحة عرض شاشة المتصفح الافتراضي التفاعلي -->
        <div class="browser-viewport-container" id="browserContainer" tabindex="0">
          <!-- إضاءة السينما المحيطية بخطوط رأسية ناعمة (Vertical Ambient Lines) -->
          <div class="ambient-glow" id="ambientGlow">
            <div class="ambient-lines-grid" id="ambientLinesGrid">
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
            </div>
          </div>
          <canvas id="browserCanvas" width="1280" height="720"></canvas>
          <div id="browserLoadingOverlay" class="browser-loading">
            <div class="spinner"></div>
            <span>جاري تشغيل المتصفح الافتراضي...</span>
          </div>

          <!-- شريط التحكم السينمائي العائم (تقديم، تأخير، تشغيل، صورة مصغرة، ملء الشاشة) -->
          <div class="cinema-playback-bar" id="browserPlaybackBar">
            <button class="playback-btn" onclick="sendBrowserMedia('seek-backward', 10)" title="تأخير 10 ثواني (⏪ 10s)">
              ⏪ 10ث
            </button>
            <button class="playback-btn play-pause-btn" onclick="sendBrowserMedia('play-pause')" title="تشغيل / إيقاف مؤقت (Space)">
              ⏯️ تشغيل / إيقاف
            </button>
            <button class="playback-btn" onclick="sendBrowserMedia('seek-forward', 10)" title="تقديم 10 ثواني (⏩ 10s)">
              ⏩ 10ث
            </button>
            <button class="playback-btn" onclick="sendBrowserMedia('toggle-mute')" title="كتم / تشغيل الصوت (M)">
              🔊 الصوت
            </button>
            <div class="playback-divider"></div>
            <button class="playback-btn fav-btn" onclick="addCurrentToFavorites()" title="حفظ الفيلم الحالي في مكتبتي المفضلة">
              ❤️ حفظ الفيلم
            </button>
            <button class="playback-btn pip-btn" onclick="togglePictureInPicture()" title="شاشة مصغرة تطفو خارج المتصفح (Picture-in-Picture)">
              📺 شاشة مصغرة (PiP)
            </button>
            <button class="playback-btn fullscreen-btn" onclick="toggleFullscreen()" title="ملء الشاشة بالكامل (Fullscreen)">
              ⛶ ملء الشاشة
            </button>
          </div>
        </div>
      </div>

      <!-- 2. واجهة مشغل الفيديو المباشر -->
      <div class="player-view" id="playerView">
        <div class="player-toolbar">
          <input type="text" id="videoUrlInput" placeholder="أدخل رابط ملف فيديو مباشر (MP4 / WebM / M3U8)..." value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
          <button class="btn-primary" onclick="applyVideoUrl()">تشغيل وتزامن 🎬</button>
          <button class="btn-secondary" onclick="document.getElementById('localFileInput').click()">📁 ملف محلي</button>
          <input type="file" id="localFileInput" accept="video/*" style="display:none;" onchange="handleLocalFile(event)">
          <button class="btn-secondary" onclick="document.getElementById('subtitleFileInput').click()">💬 ترجمة SRT</button>
          <input type="file" id="subtitleFileInput" accept=".srt,.vtt" style="display:none;" onchange="handleSubtitleFile(event)">
          <button class="btn-secondary" onclick="togglePictureInPicture()" title="شاشة مصغرة">📺 مصغرة</button>
          <button class="btn-secondary" onclick="toggleFullscreen()" title="ملء الشاشة">⛶ ملء الشاشة</button>
        </div>

        <div class="player-container">
          <div class="ambient-glow">
            <div class="ambient-lines-grid">
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
              <span class="ambient-line"></span>
            </div>
          </div>
          <video id="cinemaPlayer" controls playsinline crossorigin="anonymous">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
          </video>
        </div>
      </div>

      <!-- طبقة التفاعلات الطافية والإشعارات -->
      <div class="floating-reactions-box" id="reactionsBox"></div>
      <div class="sync-toast" id="syncToast"></div>
    </section>

    <!-- القائمة الجانبية: الدردشة والحضور -->
    <aside class="cinema-sidebar">
      <div class="sidebar-tabs">
        <button class="tab-btn active" id="tabBtnChat" onclick="switchSidebarTab('chat')">💬 الدردشة الحية</button>
        <button class="tab-btn" id="tabBtnUsers" onclick="switchSidebarTab('users')">👥 الحضور (<span id="usersCountBadge">1</span>)</button>
      </div>

      <div class="tab-content active" id="tabContentChat">
        <div class="chat-messages" id="chatMessages"></div>

        <div class="reactions-bar">
          <button class="reaction-btn" onclick="sendReaction('🍿')" title="فشار">🍿</button>
          <button class="reaction-btn" onclick="sendReaction('😂')" title="ضحك">😂</button>
          <button class="reaction-btn" onclick="sendReaction('❤️')" title="قلب">❤️</button>
          <button class="reaction-btn" onclick="sendReaction('😱')" title="صدمة">😱</button>
          <button class="reaction-btn" onclick="sendReaction('🔥')" title="حماس">🔥</button>
          <button class="reaction-btn" onclick="sendReaction('👏')" title="تصفيق">👏</button>
        </div>

        <div class="chat-input-bar">
          <input type="text" id="chatInput" placeholder="اكتب رسالة للسهرة..." onkeypress="if(event.key==='Enter') sendChatMessage()">
          <button class="btn-primary" onclick="sendChatMessage()">إرسال</button>
        </div>
      </div>

      <div class="tab-content" id="tabContentUsers">
        <div class="users-list" id="usersList"></div>
      </div>
    </aside>

  </main>

  <!-- نافذة الترحيب -->
  <div class="modal-overlay" id="welcomeModal">
    <div class="modal-box">
      <div class="modal-logo">🍿</div>
      <h2 style="font-size:20px; font-weight:800;">سهرة بلس | متصفح السينما المفتوح</h2>
      <p style="font-size:13px; color:var(--text-secondary); line-height:1.5;">متصفح حقيقي متزامن ومفتوح لجميع مواقع الإنترنت والأفلام واليوتيوب بنمط Hyperbeam.</p>

      <div style="display:flex; flex-direction:column; gap:14px; text-align:right;">
        <div>
          <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:8px;">اختر شخصيتك السينمائية:</label>
          <div class="avatar-picker" id="avatarPicker">
            <span class="avatar-opt selected" onclick="selectAvatar('🍿', this)">🍿</span>
            <span class="avatar-opt" onclick="selectAvatar('🎬', this)">🎬</span>
            <span class="avatar-opt" onclick="selectAvatar('🐱', this)">🐱</span>
            <span class="avatar-opt" onclick="selectAvatar('👑', this)">👑</span>
            <span class="avatar-opt" onclick="selectAvatar('🚀', this)">🚀</span>
            <span class="avatar-opt" onclick="selectAvatar('🎮', this)">🎮</span>
            <span class="avatar-opt" onclick="selectAvatar('🦊', this)">🦊</span>
            <span class="avatar-opt" onclick="selectAvatar('🕶️', this)">🕶️</span>
          </div>
          <input type="hidden" id="selectedAvatarInput" value="🍿">
        </div>
        <div>
          <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:4px;">اسمك في السهرة:</label>
          <input type="text" id="usernameInput" class="modal-input" placeholder="اسمك المستعار..." autofocus>
        </div>
        <div>
          <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:4px;">رمز القاعة:</label>
          <input type="text" id="customRoomInput" class="modal-input" placeholder="مثال: sahra-2026">
        </div>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn-primary" style="flex:1; padding:12px;" onclick="enterCinema(false)">دخول القاعة 🍿</button>
        <button class="btn-primary" style="flex:1; padding:12px; background:var(--bg-hover); border:1px solid var(--border-subtle);" onclick="enterCinema(true)">إنشاء قاعة جديدة 🎲</button>
      </div>
    </div>
  </div>

  <!-- نافذة مكتبة الأفلام المفضلة (Watchlist Library) -->
  <div class="modal-overlay" id="favoritesModal" style="display:none;" onclick="if(event.target===this) toggleFavoritesModal()">
    <div class="library-modal-box">
      <div class="library-modal-header">
        <div class="library-modal-title">
          <span>🎬 مكتبة أفلامي المفضلة</span>
          <span class="library-counter-badge" id="favModalCounter">0 فيلم</span>
        </div>
        <button class="modal-close-btn" onclick="toggleFavoritesModal()" title="إغلاق">✕</button>
      </div>

      <div class="library-search-box">
        <input type="text" id="favSearchInput" placeholder="🔍 ابحث في مكتبة أفلامك المحفوظة..." oninput="filterFavorites(this.value)">
      </div>

      <div class="library-content" id="favLibraryContent">
        <!-- كروت الأفلام المفضلة مع البوستر يتم توليدها ديناميكياً هنا -->
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
