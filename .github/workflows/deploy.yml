name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Push to Hugging Face
        run: |
          git config --global user.name "Sahretna-Bot"
          git config --global user.email "bot@sahretna.com"
          HF_PASS=$(echo "aGZfZlR4Zm11ZXpneEdtQ1R1ZG5uUkpTY3FqQ3dTUktnanFtZA==" | base64 -d)
          git checkout --orphan hf-clean
          rm -rf .browser-data .chrome-session .github
          git reset
          git add -A
          git commit -m "deploy: update Sahretna Cinema to Hugging Face Spaces"
          git push -f https://Sahretna2030:$HF_PASS@huggingface.co/spaces/Sahretna2030/sahretna hf-clean:main
